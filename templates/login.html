{% extends "base.html" %}

{% block title %}Login — SpoofSentry Threat Console{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-badge">SECURE ACCESS</span>
            <h2>Analyst Authentication</h2>
            <p>Access the email spoofing inspection engine and security audit logs.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username or Operator ID</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="e.g. analyst_01" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary full-width">AUTHENTICATE & ENTER</button>
        </form>

        <div class="auth-footer">
            <span>New operator unit?</span>
            <a href="{{ url_for('register') }}">Register new workspace</a>
        </div>
    </div>
</div>
{% endblock %}
