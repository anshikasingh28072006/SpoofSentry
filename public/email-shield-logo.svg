<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Bold Cool Sassy Emerald Squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06241b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm peach / gold rim highlight -->
    <linearGradient id="peachRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4" />
    </linearGradient>

    <!-- Envelope warm paper gradient -->
    <linearGradient id="mailBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf5ee" />
    </linearGradient>

    <!-- Envelope flap gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f2" />
      <stop offset="100%" stop-color="#eddcd0" />
    </linearGradient>

    <!-- Bold Electric Emerald / Mint security shield -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#031f16" flood-opacity="0.4" />
    </filter>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Squircle in Bold Emerald Gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#peachRim)" stroke-width="1.8" />

  <!-- EMAIL ENVELOPE -->
  <g filter="url(#shadow)">
    <!-- Envelope back base -->
    <rect x="22" y="36" width="84" height="56" rx="8" fill="url(#mailBodyGrad)" />
    
    <!-- Envelope interior lines / mail fold creases -->
    <path d="M 23 88 L 56 60" stroke="#d5c7b7" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M 105 88 L 72 60" stroke="#d5c7b7" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Envelope bottom fold -->
    <path d="M 22 92 L 64 63 L 106 92 Z" fill="#f5ede3" opacity="0.95" />

    <!-- Envelope top flap folded down -->
    <path d="M 23 37 Q 64 72 64 72 Q 64 72 105 37 Z" fill="url(#flapGrad)" />
    <path d="M 23 37 L 64 72 L 105 37" fill="none" stroke="#d5c7b7" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- SECURITY SENTRY SHIELD BADGE (Lower-right overlay) -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Shield Border -->
    <path d="M 82 56 C 82 56 97 52 106 48 C 106 68 102 85 82 96 C 62 85 58 68 58 48 C 67 52 82 56 82 56 Z" fill="#ffffff" />
    
    <!-- Inner Electric Emerald Shield -->
    <path d="M 82 59 C 82 59 95 55.5 103 52 C 103 68.5 99.5 82.5 82 92 C 64.5 82.5 61 68.5 61 52 C 69 55.5 82 59 82 59 Z" fill="url(#shieldGrad)" />

    <!-- Crisp Security Checkmark -->
    <path d="M 73 72 L 79 78 L 92 65" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
