    <script>
      (function() {
        // Intercept third-party browser extension errors (e.g. MetaMask, Ethereum providers, content scripts)
        function isExtensionError(err, msg, filename) {
          var str = (msg || '') + ' ' + (err && err.message ? err.message : '') + ' ' + (err && err.stack ? err.stack : '') + ' ' + (filename || '');
          var lower = str.toLowerCase();
          return (
            lower.includes('metamask') ||
            lower.includes('failed to connect to metamask') ||
            lower.includes('ethereum') ||
            lower.includes('chrome-extension://') ||
            lower.includes('moz-extension://') ||
            lower.includes('safari-extension://')
          );
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.error, event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (typeof reason === 'string') ? reason : (reason && reason.message) ? reason.message : '';
          if (isExtensionError(reason, msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return (a && a.message) ? a.message : (a && a.stack) ? a.stack : String(a);
          }).join(' ');
          if (isExtensionError(null, joined, '')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
